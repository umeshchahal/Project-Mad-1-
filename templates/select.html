<!DOCTYPE html>
<html lang="en">

<head>
    <title>select cards html </title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body" style="height: 250px;width: 350px;margin-top: 200px;">
                <h1>Select Card and Enter Detail </h1>
                <form action="" , method="post">
                    <div class="mb-3">
                        <label for="Input1" class="form-label">Available Cards </label>
                        <select class="form-select" aria-label="Default select example" id="Input1" name="card">

                            <option value="aadhar">Aadhar Card </option>
                            <option value="pan">Pan Card </option>
                            <option value="dl">Driving Licence</option>
                            <option value="dc">Election Card </option>
                        </select>
                    </div>

                    <div class="text-center">
                        <input type="submit" class="btn btn-primary" value="next"></button>
                    </div>

                </form>
            </div>
        </div>
</body>

</html>
